<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An isometric 3D cubicle office where bean-shaped AI agents work at desks or play pool, table tennis and basketball, work out, drink coffee and rest.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Agent Office Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed isometric office canvas; floating roster on the left, agent drawer on the right (bottom sheet on phones). */
:root{
  --sky-top:#dfe8fb; --sky-bot:#f4f6fc;
  --bg:#eef2fb; --panel:rgba(255,255,255,.92); --panel-solid:#ffffff;
  --ink:#1d2440; --ink-soft:#5a6383; --line:#dbe1f0; --field:#f3f5fb;
  --accent:#4a63d9; --accent-ink:#ffffff; --accent-soft:#e4e9fc;
  --ok:#1fa864; --warn:#d98a12; --info:#3f7ee8; --rest:#8a63e0; --coffee:#a8703c; --danger:#d9434b; --pp:#d63b72; --hoops:#d9661c; --gym:#0f9696;
  --shadow:0 10px 30px rgba(40,55,110,.16);
  --f-display:"Fredoka", "Baloo 2", ui-rounded, system-ui, sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky-top:#0f1631; --sky-bot:#1c2752;
  --bg:#121933; --panel:rgba(22,29,58,.92); --panel-solid:#19213f;
  --ink:#eef1ff; --ink-soft:#a3acd2; --line:#2e3864; --field:#212b52;
  --accent:#8ea2ff; --accent-ink:#0f1631; --accent-soft:#2a3570;
  --ok:#43d18a; --warn:#f2a93a; --info:#6fa2ff; --rest:#b190ff; --coffee:#d39a63; --danger:#ff6b72; --pp:#ff6f9d; --hoops:#ff9a52; --gym:#3fd3d3;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --sky-top:#0f1631; --sky-bot:#1c2752;
  --bg:#121933; --panel:rgba(22,29,58,.92); --panel-solid:#19213f;
  --ink:#eef1ff; --ink-soft:#a3acd2; --line:#2e3864; --field:#212b52;
  --accent:#8ea2ff; --accent-ink:#0f1631; --accent-soft:#2a3570;
  --ok:#43d18a; --warn:#f2a93a; --info:#6fa2ff; --rest:#b190ff; --coffee:#d39a63; --danger:#ff6b72; --pp:#ff6f9d; --hoops:#ff9a52; --gym:#3fd3d3;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;pointer-events:none;z-index:5}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 14px 8px 10px;border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--ink-soft);font-size:12px;margin-top:-2px}
.stats{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:6px;border-radius:14px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:600;font-size:12.5px;background:var(--field);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.spacer{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:var(--panel);box-shadow:var(--shadow)}
.tbtn.primary{background:var(--accent);color:var(--accent-ink)}
.switch{display:inline-flex;align-items:center;gap:8px;background:var(--panel);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;font-size:13px}
.switch input{accent-color:var(--accent);width:16px;height:16px}

.roster{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));width:264px;max-height:calc(100% - 150px);overflow:auto;
  background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:10px;z-index:4;backdrop-filter:blur(8px)}
.roster h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:4px 6px 8px;display:flex;justify-content:space-between;align-items:baseline}
.roster h2 span{font-family:var(--f-body);font-size:11.5px;color:var(--ink-soft);font-weight:500}
.ag{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:12px}
.ag:hover{background:var(--field)}
.ag.sel{background:var(--accent-soft)}
.kind{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rest);margin-left:6px}
.ag .nm{font-weight:700;font-size:14px;line-height:1.1}
.ag .rl{color:var(--ink-soft);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag > div{min-width:0}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;background:var(--field)}
.bar{height:3px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.example{font-size:11.5px;color:var(--ink-soft);margin:10px 6px 2px;line-height:1.4}

.drawer{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:380px;
  background:var(--panel-solid);border-radius:20px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.dh{padding:16px 16px 12px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;line-height:1.05}
.dh p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
.x{border:0;background:var(--field);width:34px;height:34px;border-radius:10px;font-size:18px;line-height:1}
.call{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.call input{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px}
.call input:disabled{opacity:.6}
.call button:disabled{opacity:.45;cursor:not-allowed}
.call button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.tabs{display:flex;gap:4px;padding:10px 16px 0}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px 10px 0 0;font-weight:700;color:var(--ink-soft);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tb{flex:1;overflow:auto;padding:14px 16px 18px;border-top:1px solid var(--line)}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box}
.fld textarea{min-height:86px;resize:vertical;line-height:1.45}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.sw input[type=color]{width:34px;height:30px;padding:0;border:0;background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.note{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0}
.cur{background:var(--field);border-radius:14px;padding:12px;margin-bottom:14px}
.cur .k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cur .t{font-weight:700;font-size:15px;margin:4px 0 8px}
.cur .bar{height:6px}
.cur .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:6px;font-variant-numeric:tabular-nums}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.hist .t{font-weight:600;line-height:1.3}
.hist .m{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hist .tick{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--ok)}
.hist .tick.q{background:var(--warn)}
.log{font-family:var(--f-mono);font-size:12px;line-height:1.55;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:2px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.log .lv-ok{color:var(--ok)} .log .lv-call{color:var(--accent)} .log .lv-warn{color:var(--warn)}
.empty{color:var(--ink-soft);font-size:13px;padding:10px 0}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink-soft);z-index:3;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-weight:600;z-index:9;box-shadow:var(--shadow)}

@media (max-width: 820px){
  .roster{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px}
  .roster h2,.roster .example{display:none}
  .ag{grid-template-columns:26px auto;width:auto;flex:none;padding:6px 10px 6px 6px}
  .ag .rl,.ag .pill,.ag .bar{display:none}
  .drawer{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;top:38%;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .hint{display:none}
  .stats{order:3;width:100%;box-sizing:border-box}
  .brand small{display:none}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<div id="stage"></div>

<header class="topbar">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="3" width="28" height="28" rx="9" fill="var(--accent)"/><ellipse cx="17" cy="15" rx="8" ry="6.5" fill="#fff"/><rect x="13.3" y="12.6" width="2" height="4" rx="1" fill="#1d2440"/><rect x="18.7" y="12.6" width="2" height="4" rx="1" fill="#1d2440"/></svg>
    <div><h1>Agent Office Hub</h1><small>Click a bean to see its profile, tasks and log</small></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <label class="switch"><input type="checkbox" id="auto" checked> Autopilot demo</label>
  <button class="tbtn primary" id="addBtn">+ Add agent</button>
</header>

<nav class="roster" id="roster" aria-label="Agents"></nav>

<aside class="drawer" id="drawer" hidden aria-label="Agent details">
  <div class="dh">
    <svg id="dAv" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"></svg>
    <div style="min-width:0"><h3 id="dName"></h3><p id="dRole"></p></div>
    <button class="x" id="dClose" aria-label="Close">×</button>
  </div>
  <form class="call" id="callForm">
    <input id="callTask" placeholder="Give this agent a task…" autocomplete="off" aria-label="Task for this agent">
    <button type="submit" id="callBtn">Call to desk</button>
  </form>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="tasks" aria-selected="true">Tasks</button>
    <button class="tab" role="tab" data-tab="log" aria-selected="false">Log</button>
    <button class="tab" role="tab" data-tab="profile" aria-selected="false">Edit</button>
  </div>
  <div class="tb" id="tabBody"></div>
</aside>

<div class="hint">Drag to rotate · scroll or pinch to zoom · click a bean</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const rand = (a,b)=>a+Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtT = ts => new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const fmtDur = s => s<60? Math.round(s)+'s' : Math.floor(s/60)+'m '+String(Math.round(s%60)).padStart(2,'0')+'s';
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ------------------------------------------------------------------ status */
const STATUS = {
  working:{label:'Working',  color:'#1fa864', css:'var(--ok)'},
  running:{label:'On the way',color:'#e89a1a', css:'var(--warn)'},
  walking:{label:'Strolling', color:'#8d97b8', css:'var(--ink-soft)'},
  pool:   {label:'Playing pool',color:'#3f7ee8',css:'var(--info)'},
  coffee: {label:'Coffee break',color:'#a8703c',css:'var(--coffee)'},
  rest:   {label:'Resting',  color:'#8a63e0', css:'var(--rest)'},
  pingpong:{label:'Table tennis',color:'#e0457b',css:'var(--pp)'},
  hoops:  {label:'Basketball',color:'#e8742a', css:'var(--hoops)'},
  gym:    {label:'Working out',color:'#0fa3a3', css:'var(--gym)'}
};
const SPOT_NAME={pool:'the pool table',coffee:'the coffee bar',rest:'the lounge',pingpong:'the table tennis table',hoops:'the basketball court',gym:'the gym'};
const ACTIVITIES=[['any','Anything'],['pool','Pool'],['coffee','Coffee'],['rest','Resting'],['pingpong','Table tennis'],['hoops','Basketball'],['gym','Gym']];
const PALETTE = ['#3ccf7a','#ffb02e','#ff5fb8','#4f8bff','#a77bff','#ff6b5a','#22c7d6','#f7d046','#7c8cff','#ff8f3d'];

/* ------------------------------------------------------------------ data */
const now = Date.now();
const SEED = [
  {name:'Scout', role:'Research analyst', color:'#3ccf7a', model:'claude-sonnet-5-5', instructions:'Find primary sources, cite every claim, and summarise in five bullets.'},
  {name:'Patch', role:'Code fixer',       color:'#ffb02e', model:'claude-opus-5-5',   instructions:'Reproduce the bug first, write a failing test, then fix. Open a draft PR.'},
  {name:'Blush', role:'Design reviewer',  color:'#ff5fb8', model:'claude-sonnet-5-5', instructions:'Review screens for spacing, contrast and copy. Flag WCAG AA failures.'},
  {name:'Ledger',role:'Finance reconciler',color:'#4f8bff',model:'claude-sonnet-5-5', instructions:'Match transactions to invoices. Anything over $500 unmatched goes to a human.'},
  {name:'Quill', role:'Content writer',   color:'#a77bff', model:'claude-haiku-5-5',  instructions:'Write in plain language, short sentences, house tone. No jargon.'},
  {name:'Relay', role:'Support triage',   color:'#ff6b5a', model:'claude-haiku-5-5',  instructions:'Tag tickets by product area and urgency; draft replies for P3 and below.'},
  {name:'Sentry',role:'Ops monitor',      color:'#22c7d6', model:'claude-sonnet-5-5', instructions:'Watch error rates and latency. Page on-call if p95 > 800ms for 5 minutes.', favorite:'hoops'},
  {name:'Mochi', role:'Office mascot',    color:'#f7d046', model:'none', instructions:'Relax only. Never takes tasks.', kind:'relax', favorite:'pingpong'},
  {name:'Snooze',role:'Nap specialist',   color:'#7c8cff', model:'none', instructions:'Relax only. Never takes tasks.', kind:'relax', favorite:'rest'},
  {name:'Dunk',  role:'Court regular',    color:'#ff8f3d', model:'none', instructions:'Relax only. Never takes tasks.', kind:'relax', favorite:'hoops'}
];
const TASKS = {
  'Research analyst':['Competitor pricing scan','Summarise 12 customer interviews','Market size for EU fintech','Find papers on retrieval eval'],
  'Code fixer':['Fix flaky checkout test','Patch login redirect loop','Upgrade lodash, fix breakages','Null pointer in invoice export'],
  'Design reviewer':['Review onboarding screens','Contrast audit on dashboard','Check empty states copy','Mobile nav spacing pass'],
  'Finance reconciler':['Reconcile October Stripe payouts','Match vendor invoices','Flag duplicate expenses','Close-month accrual check'],
  'Content writer':['Draft launch blog post','Rewrite pricing FAQ','Newsletter for November','Release notes v4.2'],
  'Support triage':['Triage overnight queue','Tag 40 billing tickets','Draft replies for P3 tickets','Spot trending complaints'],
  'Ops monitor':['Investigate latency spike','Weekly uptime report','Check disk alerts on db-2','Review error budget'],
  _:['Prepare weekly summary','Clean up backlog','Answer open questions','Process inbox']
};
const STEPS = {
  'Research analyst':['Searching sources for "{t}"','Read {n} pages, kept {m}','Cross-checking figures','Drafting summary','Adding citations'],
  'Code fixer':['Cloning repository','Reproducing: test fails as expected','Patching src/{f}.ts','Test suite: {n} passed, 0 failed','Opening draft pull request'],
  'Design reviewer':['Loading {n} screens','Contrast check: {m} issues','Annotating spacing','Writing review notes'],
  'Finance reconciler':['Pulling {n} transactions','Matched {m} of {n}','Flagging unmatched items','Exporting reconciliation sheet'],
  'Content writer':['Outlining "{t}"','Draft 1: {n} words','Tightening intro','Checking tone against style guide'],
  'Support triage':['Fetched {n} tickets','Tagged {m} by product area','Drafting replies','Escalating 2 to humans'],
  'Ops monitor':['Querying metrics for last 24h','p95 latency {n}ms','Correlating with deploys','Writing incident note'],
  _:['Reading context for "{t}"','Working through step {m}','Checking output','Wrapping up']
};
const FILES=['checkout','auth','invoice','router','api/client','utils/date'];
function fillStep(s,t){return s.replace('{t}',t).replace('{n}',Math.floor(rand(40,420))).replace('{m}',Math.floor(rand(3,30))).replace('{f}',pick(FILES));}

const STORE_KEY='agent-office-hub-v2';
function load(){ try{ const raw=localStorage.getItem(STORE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(agents.map(a=>({id:a.id,name:a.name,role:a.role,color:a.color,model:a.model,instructions:a.instructions,desk:a.desk,kind:a.kind,favorite:a.favorite,history:a.history.slice(0,30),log:a.log.slice(-150)})))); }catch(e){} }

/* ------------------------------------------------------------------ three setup */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const FR=18;
const camera=new THREE.OrthographicCamera(-FR,FR,FR,-FR,-200,400);
camera.position.set(28,26,30);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(-2.5,0,2.5);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.minZoom=.55; controls.maxZoom=3.2;
controls.maxPolarAngle=1.2; controls.minPolarAngle=.45;
controls.enablePan=true; controls.screenSpacePanning=true;
camera.zoom=1.1;camera.updateProjectionMatrix();
controls.update();

scene.add(new THREE.HemisphereLight(0xf4f7ff,0x7d86ad,.95));
const sun=new THREE.DirectionalLight(0xffffff,.85);
sun.position.set(14,28,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:22,bottom:-22,near:1,far:80});
sun.shadow.bias=-.0006; sun.shadow.normalBias=.02;
scene.add(sun);

function mat(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o||{}));}
const M={

/* ------------------------------------------------------------------ agents */

if(saved&&saved.length){saved.forEach(s=>agents.push(newAgent(s)));}
else{let di=0;SEED.forEach((s,i)=>{const relax=s.kind==='relax';const a=newAgent(Object.assign({desk:relax?null:di++},s));if(relax){a.log.push({t:now-36e5,msg:'Clocked in to relax. No tasks, ever.',lv:'ok'});}else seedHistory(a,i);agents.push(a);});}

/* placement: start everyone at leisure, then call a few to desks */
agents.forEach(a=>{const s=pickLeisure(a);if(s){claim(a,s);const p=s.pos;a.root.position.set(p[0],0,p[1]);a.root.rotation.y=s.face;arriveAt(a,s,true);}else{a.root.position.set(rand(-2,2),0,rand(1,4));a.status='walking';}});
function freeLeisure(type){const fr=leisure.filter(s=>!s.taken&&(!type||s.type===type));return fr.length?pick(fr):null;}
function pickLeisure(a){if(a.favorite&&a.favorite!=='any'&&Math.random()<.7){const f=freeLeisure(a.favorite);if(f)return f;}return freeLeisure();}
function claim(a,s){if(a.spot&&a.spot.taken===a)a.spot.taken=null;s.taken=a;a.spot=s;}

/* ------------------------------------------------------------------ movement */
function setPath(a,spot,run){
  const here=a.root.position;
  const exit=(a.spot&&a.mode!=='walking')?(a.spot.approach||[]).slice().reverse():[];
  if(a.spot&&a.spot.taken===a) a.spot.taken=null;
  if(a.target&&a.target.taken===a) a.target.taken=null;
  if(spot.type!=='desk') spot.taken=a;
  const entry=(spot.approach||[]).concat([spot.pos]);
  const P=exit.length?exit[exit.length-1]:[here.x,here.z], Q=entry[0];
  const mid=[];
  if(crossesCubes(P,Q)){ if(P[0]<-3) mid.push([-2.3,P[1]]); mid.push([-2.3,Q[1]]); }
  a.path=exit.concat(mid,entry).map(p=>new THREE.Vector3(p[0],0,p[1]));
  a.mode='walking';a.run=!!run;a.target=spot;a.status=run?'running':'walking';
  drawLabel(a);
}
function inCubes(x,z){ return x<-3.3 && ((z>-10.7&&z<-7.4)||(z>-5.7&&z<-2.4)); }
function crossesCubes(a,b){ for(let k=0;k<=20;k++){const t=k/20;if(inCubes(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t)) return true;} return false; }

function arriveAt(a,s,instant){
  a.mode='at';a.status=s.type==='desk'?'working':s.type;
  if(s.type==='desk'){ a.hpT=1; startWork(a); }
  else { a.timer=rand(28,60); }
  drawLabel(a);
}

/* ------------------------------------------------------------------ tasks */
function callAgent(a,title,source){
  if(a.kind==='relax'){addLog(a,'Ignored a task'+(source?' from '+source:'')+'. Relax-only agents do not work.','warn');if(source!=='api')toast(a.name+' only relaxes. Change their type in Edit to give them work.');return false;}
  title=(title||'').trim()||pick(TASKS[a.role]||TASKS._);
  if(a.task){a.queue.push(title);addLog(a,'Queued: '+title,'warn');toast(a.name+' is busy. Task queued.');return;}
  a.task={title,start:null,called:Date.now(),dur:rand(28,55),progress:0};
  addLog(a,'Called'+(source?' by '+source:'')+': '+title,'call');
  if(a.desk==null){addLog(a,'No free desk. Working from the lounge.','warn');a.task.start=Date.now();a.status='working';return true;}
  setPath(a,desks[a.desk].spot,true);
  if(a.id===selId) renderDrawer();
  return true;
}
function startWork(a){
  if(!a.task) {a.task={title:pick(TASKS[a.role]||TASKS._),start:null,called:Date.now(),dur:rand(28,55),progress:0};}
  a.task.start=Date.now();a.nextLog=rand(2,4);
  addLog(a,'At desk. Headphones on. Starting "'+a.task.title+'"','');
  const d=desks[a.desk]; if(d){ d.chartTex=d.chartTex||screenTex(a.color); d.scrMat.map=d.chartTex; d.scrMat.needsUpdate=true; d.lamp.material.emissive.set(a.color); d.lamp.material.emissiveIntensity=1.2; }
}
function finishWork(a){

  a.history.unshift({title:t.title,start:t.called,end:Date.now(),status:'done',result:'Completed'});
  addLog(a,'Task done in '+fmtDur(el)+': '+t.title,'ok');
  a.task=null;
  if(a.queue.length){const n=a.queue.shift();a.task={title:n,start:Date.now(),called:Date.now(),dur:rand(28,55),progress:0};addLog(a,'Picking up queued task: '+n,'call');a.nextLog=rand(2,4);save();return;}
  a.hpT=0;
  const d=desks[a.desk];
  const wasRelax=a.kind==='relax'; if(d){ d.scrMat.map=idleScreen; d.scrMat.needsUpdate=true; d.lamp.material.emissiveIntensity=0; }
  if(wasRelax) a.desk=null;
  const s=pickLeisure(a); if(s){setPath(a,s,false); addLog(a,'Heading to '+SPOT_NAME[s.type],'');}
  save();

}

/* ------------------------------------------------------------------ animation */
function lerp(a,b,t){return a+(b-a)*t;}
function updateAgent(a,dt,T){
  const P=a.pose; let tgt={rigY:0,torsoX:0,legX:0,legZ:0,armX0:0,armX1:0,armZ:.18};
  let legSwing=0, armSwing=0, bob=0;
  a.anim+=dt;
  if(a.mode==='walking'){
    const spd=a.run?4.6:1.9;
    const tp=a.path[0];
    if(tp){const dx=tp.x-a.root.position.x,dz=tp.z-a.root.position.z;const dist=Math.hypot(dx,dz);
      if(dist<.06){a.path.shift();}
      else{const st=Math.min(dist,spd*dt);a.root.position.x+=dx/dist*st;a.root.position.z+=dz/dist*st;
        const ang=Math.atan2(dx,dz);let d=ang-a.root.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));a.root.rotation.y+=d*Math.min(1,dt*12);}

      if(Math.abs(d)<.08){ a.root.rotation.y=s.face; a.spot=s; a.target=null; if(s.type!=='desk') s.taken=a; arriveAt(a,s); } }
    a.phase+=dt*(a.run?15:8);
    legSwing=Math.sin(a.phase)*(a.run?.95:.55); armSwing=-legSwing*(a.run?1.1:.7); bob=Math.abs(Math.sin(a.phase))*(a.run?.14:.06);
    tgt.torsoX=a.run?.22:.05; tgt.armZ=a.run?.35:.2;
  } else if(a.mode==='at'){
    const s=a.spot, pose=s.pose;
    if(pose==='desk'){ tgt.rigY=s.seatY-.32; tgt.legX=-1.45; tgt.armX0=tgt.armX1=-1.15; tgt.armZ=.08; tgt.torsoX=.08;
      const ty=Math.sin(T*22+a.anim)*.07, ty2=Math.sin(T*19+a.anim+1.3)*.07; armSwing=0; a._type=[ty,ty2]; bob=Math.sin(T*3)*.01; }
    else if(pose==='pool'){ const cyc=(a.anim%5.5)/5.5; const aim=cyc<.7; tgt.torsoX=aim?.45:.08; tgt.armX0=-1.2; tgt.armX1=-1.0; tgt.armZ=.05;
      a._stroke=aim? Math.max(0,Math.sin(cyc/.7*Math.PI*3))*.18:0; if(cyc>.69&&cyc<.7+dt/5.5&&POOL.balls) poolShot(); }
    else if(pose==='watch'){ tgt.armX0=-.3; tgt.armX1=-.3; tgt.armZ=.35; bob=Math.abs(Math.sin(T*2+a.anim))*.03; }
    else if(pose==='coffee'){ const cyc=(a.anim%6)/6; const sip=cyc>.55&&cyc<.85; tgt.armX1=sip?-2.35:-1.0; tgt.armX0=-.1; tgt.armZ=.2; a._sip=sip; bob=Math.sin(T*1.5+a.anim)*.01; }
    else if(pose==='sofa'){ tgt.rigY=s.seatY-.32; tgt.legX=-1.45; tgt.torsoX=-.28; tgt.armX0=tgt.armX1=-.25; tgt.armZ=.5; bob=Math.sin(T*1.6+a.anim)*.012; }
    else if(pose==='beanbag'){ tgt.rigY=s.seatY-.4; tgt.legX=-1.25; tgt.torsoX=-.55; tgt.armX0=tgt.armX1=-.1; tgt.armZ=.7; bob=Math.sin(T*1.4+a.anim)*.015; }
    else if(pose==='pingpong'){ tgt.rigY=-.04; tgt.torsoX=.22; tgt.legX=-.15; tgt.armX0=-.6; tgt.armZ=.3;
      const sw=Math.sin(T*Math.PI/PP_HALF + (s.side?Math.PI:0)); tgt.armX1=-1.0-sw*.55; bob=Math.abs(Math.sin(T*5+a.anim))*.04; }
    else if(pose==='bench'){ tgt.rigY=s.seatY-.32; tgt.legX=-1.45; tgt.torsoX=.05; tgt.armX0=tgt.armX1=-.5; tgt.armZ=.15;
      a.root.rotation.y=s.face+Math.sin(T*Math.PI/PP_HALF)*.35; }
    else if(pose==='hoops'){ const c=(a.anim%4.2)/4.2; a._hc=c;

      else if(c<.7){ tgt.armX0=tgt.armX1=-2.9; tgt.armZ=.05; bob=c>.63?.25:0; }
      else { tgt.armX0=tgt.armX1=-2.2+(c-.7)*4; tgt.armZ=.1; } }
    else if(pose==='treadmill'){ a.phase+=dt*13; legSwing=Math.sin(a.phase)*.85; armSwing=-legSwing; bob=Math.abs(Math.sin(a.phase))*.12; tgt.rigY=s.seatY; tgt.torsoX=.18; tgt.armZ=.3; }
    else if(pose==='lift'){ const c1=Math.sin(T*2.6+a.anim); tgt.armX0=-.25-Math.max(0,c1)*1.9; tgt.armX1=-.25-Math.max(0,-c1)*1.9; tgt.armZ=.12; tgt.legZ=.12; }

    const el=(Date.now()-a.task.start)/1000; a.task.progress=clamp(el/a.task.dur,0,1);
    a.nextLog-=dt; if(a.nextLog<=0){a.nextLog=rand(3.5,7);addLog(a,fillStep(pick(STEPS[a.role]||STEPS._),a.task.title),'');}

  if(a.zzz.visible){a.zzz.position.set(.35,1.9+Math.sin(T*1.5+a.anim)*.12,.0);a.zzz.material.opacity=.6+Math.sin(T*2+a.anim)*.35;}
  // headphones: drop on when working
  const want=a.hpT; const cur=a.hp.scale.x; const nv=lerp(cur,want?1:.01,Math.min(1,dt*7)); a.hp.scale.setScalar(nv); a.hp.visible=nv>.05; a.hp.position.y=.95+(1-nv)*.6;
  // blink
  const bl=((T+a.anim*3)%4)<.12?.15:1; a.eyes.forEach(e=>e.scale.y=.066*bl);
  // ring
  a.ring.visible=a.id===selId; if(a.ring.visible){a.ring.material.opacity=.6+Math.sin(T*4)*.3;}
}
function hoopBall(a){
  const c=a._hc||0, p=a.root.position, ry=a.root.rotation.y, f=new THREE.Vector3(Math.sin(ry),0,Math.cos(ry));
  const hand=p.clone().addScaledVector(f,.42).add(new THREE.Vector3(Math.cos(ry)*-.38,0,Math.sin(ry)*.38));
  const top=p.clone().addScaledVector(f,.2); top.y=2.2;
  const b=a.bball.position;
  if(c<.55){ b.copy(hand); b.y=.15+Math.abs(Math.cos(c*42))*.55; }
  else if(c<.68){ b.copy(top); b.y+= (c>.63?.25:0); }
  else if(c<.86){ const u=(c-.68)/.18; b.lerpVectors(top,HOOP.rim,u); b.y+=Math.sin(u*Math.PI)*1.6; }
  else { const u=(c-.86)/.14; const floor=HOOP.rim.clone(); floor.y=.15; b.lerpVectors(HOOP.rim,hand,u); b.y=3.05*(1-u)+ .15*u + Math.sin(u*Math.PI)*.5; }
}
const PP_HALF=.75;
function updatePingPong(T){
  const sp=leisure.filter(s=>s.pose==='pingpong');
  const both=sp.every(s=>s.taken&&s.taken.mode==='at'&&s.taken.spot===s);
  const ball=PP.ball.position;
  if(both){ const ph=(T/PP_HALF)%2; const dir=ph<1?1:-1; const u=ph<1?ph:ph-1; const x0=-1.4*dir, x1=1.4*dir;
    ball.x=x0+(x1-x0)*u; ball.z=Math.sin(T*1.3)*.4; ball.y=.82+Math.abs(Math.sin(u*Math.PI*2))*(u<.5?.55:.3); }
  else { ball.set(.4,.84,.2); }
  if(GYM.belts){ GYM.belts.forEach((b,i)=>{ const on=leisure.some(s=>s.pose==='treadmill'&&Math.abs(s.pos[0]-b.parent.position.x)<.1&&s.taken&&s.taken.mode==='at'); b.material.color.setHex(on?((Math.floor(T*12)%2)?0x22252f:0x1a1c24):0x1a1c24); }); }
}
function poolShot(){const b=POOL.balls[1+Math.floor(Math.random()*(POOL.balls.length-1))];const a=Math.random()*Math.PI*2;b.vx=Math.cos(a)*1.4;b.vz=Math.sin(a)*1.4;}
function updatePool(dt){if(!POOL.balls)return;POOL.balls.forEach(b=>{if(!b.vx&&!b.vz)return;b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;if(Math.abs(b.m.position.x)>1.65){b.vx*=-1;b.m.position.x=Math.sign(b.m.position.x)*1.65;}if(Math.abs(b.m.position.z)>.82){b.vz*=-1;b.m.position.z=Math.sign(b.m.position.z)*.82;}b.vx*=Math.pow(.35,dt);b.vz*=Math.pow(.35,dt);if(Math.hypot(b.vx,b.vz)<.03){b.vx=b.vz=0;}});}

/* ------------------------------------------------------------------ picking */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let downAt=null;
function pickAt(ev){const r=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(agents.map(a=>a.root),true).filter(h=>h.object.isMesh&&h.object.userData.agentId&&h.object.visible);return hits.length?hits[0].object.userData.agentId:null;}
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt)return;const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]);downAt=null;if(moved>6)return;const id=pickAt(e);select(id);});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;renderer.domElement.style.cursor=pickAt(e)?'pointer':'';});

/* ------------------------------------------------------------------ UI */
const rosterEl=$('#roster'), drawer=$('#drawer'), tabBody=$('#tabBody');
let curTab='tasks', confirmDel=false;
function beanSvg(color,size){return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="3" width="28" height="42" rx="14" fill="${color}"/><ellipse cx="24" cy="17" rx="10" ry="8" fill="#fff"/><rect x="20.5" y="13.5" width="2.2" height="5" rx="1.1" fill="#1d2440"/><rect x="25.3" y="13.5" width="2.2" height="5" rx="1.1" fill="#1d2440"/></svg>`;}
function statusOf(a){return STATUS[a.status]||STATUS.walking;}
function renderRoster(){
  const order=['working','running','pool','coffee','rest','walking'];
  rosterEl.innerHTML=`<h2>Agents <span>${agents.filter(a=>a.kind!=='relax').length} workers · ${agents.filter(a=>a.kind==='relax').length} chill</span></h2>`+agents.map(a=>{const st=statusOf(a);
    return `<button class="ag${a.id===selId?' sel':''}" data-id="${a.id}">${beanSvg(a.color,30)}<div><div class="nm">${esc(a.name)}${a.kind==='relax'?'<span class="kind">chill</span>':''}</div><div class="rl">${esc(a.task?a.task.title:a.role)}</div>${a.task&&a.task.start?`<div class="bar"><i style="width:${Math.round(a.task.progress*100)}%"></i></div>`:''}</div><span class="pill" style="color:${st.css}"><span class="dot" style="background:${st.css}"></span>${st.label}</span></button>`;}).join('')+
    `<p class="example">${saved?'Your saved agents.':'Example agents and history to show how it works. Edit them or add your own.'}</p>`;
  const counts={};agents.forEach(a=>{const k=a.status==='walking'?'running':a.status;counts[k]=(counts[k]||0)+1;});
  $('#stats').innerHTML=[['working','Working'],['running','Moving'],['pool','Pool'],['pingpong','Table tennis'],['hoops','Basketball'],['gym','Gym'],['coffee','Coffee'],['rest','Resting']].map(([k,l])=>`<span class="chip"><span class="dot" style="background:${STATUS[k].css}"></span>${l} ${counts[k]||0}</span>`).join('');
}
rosterEl.addEventListener('click',e=>{const b=e.target.closest('.ag');if(b)select(b.dataset.id,true);});

function select(id,focus){
  const prev=agents.find(a=>a.id===selId); selId=id; confirmDel=false;
  if(prev){prev.selected=false;drawLabel(prev);}
  const a=agents.find(x=>x.id===id);
  if(!a){drawer.hidden=true;renderRoster();return;}
  a.selected=true;drawLabel(a);drawer.hidden=false;renderDrawer();renderRoster();
  if(focus){focusOn=a;focusT=0;}
}
let focusOn=null,focusT=0;
$('#dClose').onclick=()=>select(null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)select(null);});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curTab=t.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));renderTab();});

function syncCall(a){const r=a.kind==='relax';$('#callBtn').textContent=r?'Relax only':(a.task?'Queue task':'Call to desk');$('#callBtn').disabled=r;$('#callTask').disabled=r;$('#callTask').placeholder=r?a.name+' only relaxes and never takes tasks':'Give this agent a task…';}
function renderDrawer(){
  const a=agents.find(x=>x.id===selId);if(!a)return;
  $('#dAv').outerHTML=beanSvg(a.color,48).replace('<svg','<svg id="dAv"');
  $('#dName').textContent=a.name; const st=statusOf(a);
  $('#dRole').innerHTML=`${esc(a.role)} · <span style="color:${st.css};font-weight:700">${st.label}</span>`;
  syncCall(a);
  renderTab();
}
function renderTab(){
  const a=agents.find(x=>x.id===selId);if(!a)return;
  if(curTab==='tasks'){
    const t=a.task;
    let h='';
    if(t){const el=t.start?(Date.now()-t.start)/1000:0;
      h+=`<div class="cur"><div class="k">${t.start?'Working on':'Heading to desk for'}</div><div class="t">${esc(t.title)}</div><div class="bar"><i style="width:${Math.round(t.progress*100)}%"></i></div><div class="meta"><span>${Math.round(t.progress*100)}%</span><span>${t.start?fmtDur(el)+' elapsed':'running to desk…'}</span></div></div>`;}
    else if(a.kind==='relax') h+=`<div class="cur"><div class="k">Relax-only agent</div><div class="t">${esc(a.name)} never works. Right now: ${statusOf(a).label.toLowerCase()}.</div><div class="meta"><span>Switch Type to Worker in Edit to give them a desk.</span></div></div>`;
    else h+=`<div class="cur"><div class="k">Current task</div><div class="t">None. ${esc(a.name)} is ${statusOf(a).label.toLowerCase()}.</div><div class="meta"><span>Use “Call to desk” above to assign one.</span></div></div>`;
    if(a.queue.length) h+=`<div class="k" style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px">Queued</div><ul class="hist" style="margin-bottom:14px">${a.queue.map(q=>`<li><span class="tick q">…</span><div class="t">${esc(q)}</div><span class="m">waiting</span></li>`).join('')}</ul>`;
    h+=`<div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px">History</div>`;
    h+=a.history.length?`<ul class="hist">${a.history.map(x=>`<li><span class="tick">✓</span><div><div class="t">${esc(x.title)}</div><div class="m">${fmtT(x.start)} → ${fmtT(x.end)}</div></div><span class="m">${fmtDur((x.end-x.start)/1000)}</span></li>`).join('')}</ul>`:`<p class="empty">No finished tasks yet.</p>`;
    tabBody.innerHTML=h;
  } else if(curTab==='log'){
    const atBottom=tabBody.scrollHeight-tabBody.scrollTop-tabBody.clientHeight<40;
    tabBody.innerHTML=a.log.length?`<ul class="log">${a.log.slice(-200).map(l=>`<li><time>${fmtT(l.t)}</time><span class="lv-${l.lv}">${esc(l.msg)}</span></li>`).join('')}</ul>`:`<p class="empty">Nothing logged yet.</p>`;
    if(atBottom||!tabBody.dataset.scrolled){tabBody.scrollTop=tabBody.scrollHeight;tabBody.dataset.scrolled='1';}
  } else {
    if(tabBody.querySelector('#fName')&&tabBody.dataset.for===a.id&&!confirmDel&&!tabBody.dataset.redraw)return;
    tabBody.dataset.for=a.id; delete tabBody.dataset.redraw;
    tabBody.innerHTML=`
      <div class="fld"><label for="fName">Name</label><input id="fName" value="${esc(a.name)}" maxlength="18"></div>
      <div class="fld"><label for="fRole">Role</label><input id="fRole" value="${esc(a.role)}" list="roles"><datalist id="roles">${Object.keys(TASKS).filter(k=>k!=='_').map(k=>`<option value="${k}">`).join('')}</datalist></div>
      <div class="fld"><label for="fKind">Type</label><select id="fKind"><option value="worker" ${a.kind!=='relax'?'selected':''}>Worker: takes tasks at a desk</option><option value="relax" ${a.kind==='relax'?'selected':''}>Relax only: never works</option></select></div>
      <div class="fld"><label for="fFav">Favourite activity</label><select id="fFav">${ACTIVITIES.map(([v,l])=>`<option value="${v}" ${a.favorite===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="fld"><label for="fModel">Model</label><input id="fModel" value="${esc(a.model)}"></div>
      <div class="fld"><label>Colour</label><div class="sw" id="fSw">${PALETTE.map(c=>`<button type="button" style="background:${c}" data-c="${c}" aria-label="Colour ${c}" aria-pressed="${c.toLowerCase()===a.color.toLowerCase()}"></button>`).join('')}<input type="color" id="fColor" value="${a.color}" aria-label="Custom colour"></div></div>
      <div class="fld"><label for="fIns">Instructions</label><textarea id="fIns">${esc(a.instructions)}</textarea></div>
      <div class="fld"><label for="fDesk">Desk</label><select id="fDesk">${desks.map(d=>{const o=agents.find(x=>x.desk===d.i&&x!==a);return `<option value="${d.i}" ${a.desk===d.i?'selected':''} ${o?'disabled':''}>Desk ${d.i+1}${o?' · '+esc(o.name):''}</option>`;}).join('')}</select></div>
      <div class="row"><button class="btn primary" id="fSave">Save changes</button>${confirmDel?`<button class="btn danger solid" id="fDelYes">Delete ${esc(a.name)}</button><button class="btn" id="fDelNo">Keep</button>`:`<button class="btn danger" id="fDel">Delete agent</button>`}</div>
      <p class="note">Changes save in this browser.</p>`;
    let pending=a.color;
    tabBody.querySelectorAll('#fSw button').forEach(b=>b.onclick=()=>{pending=b.dataset.c;$('#fColor').value=pending;tabBody.querySelectorAll('#fSw button').forEach(x=>x.setAttribute('aria-pressed',x===b));a.bodyMat.color.set(pending);});
    $('#fColor').oninput=e=>{pending=e.target.value;a.bodyMat.color.set(pending);tabBody.querySelectorAll('#fSw button').forEach(x=>x.setAttribute('aria-pressed','false'));};
    $('#fSave').onclick=()=>{a.name=$('#fName').value.trim()||a.name;a.role=$('#fRole').value.trim()||a.role;a.model=$('#fModel').value.trim();a.instructions=$('#fIns').value;a.color=pending;
      a.favorite=$('#fFav').value; setKind(a,$('#fKind').value);
      const nd=+$('#fDesk').value; if(a.kind!=='relax'&&nd!==a.desk&&!a.task&&!agents.some(o=>o!==a&&o.desk===nd)){a.desk=nd;} recolor(a);addLog(a,'Profile updated','');save();renderDrawer();renderRoster();toast('Saved '+a.name);tabBody.dataset.redraw='1';};
    const del=$('#fDel'); if(del) del.onclick=()=>{confirmDel=true;tabBody.dataset.redraw='1';renderTab();};
    const no=$('#fDelNo'); if(no) no.onclick=()=>{confirmDel=false;tabBody.dataset.redraw='1';renderTab();};
    const yes=$('#fDelYes'); if(yes) yes.onclick=()=>{removeAgent(a);};
  }
}
function setKind(a,kind){
  if(kind===a.kind) return;
  if(kind==='relax'){ if(a.task){a.queue=[];a.task.dur=0;} a.kind='relax'; const d=desks[a.desk]; if(d&&!a.task){d.scrMat.map=idleScreen;d.scrMat.needsUpdate=true;d.lamp.material.emissiveIntensity=0;} if(!a.task) a.desk=null; addLog(a,'Now relax-only','ok'); }
  else { a.kind='worker'; const free=desks.find(d=>!agents.some(o=>o.desk===d.i)); a.desk=free?free.i:null; addLog(a,'Now a worker'+(free?' at desk '+(free.i+1):' (no free desk)'),'ok'); }
}
function removeAgent(a){
  if(a.spot&&a.spot.taken===a)a.spot.taken=null;
  const d=desks[a.desk]; if(d){d.scrMat.map=idleScreen;d.scrMat.needsUpdate=true;d.lamp.material.emissiveIntensity=0;}
  scene.remove(a.root); scene.remove(a.bball); agents=agents.filter(x=>x!==a); toast('Deleted '+a.name); select(null); save();
}
$('#callForm').addEventListener('submit',e=>{e.preventDefault();const a=agents.find(x=>x.id===selId);if(!a)return;callAgent(a,$('#callTask').value,'you');$('#callTask').value='';renderDrawer();renderRoster();});
$('#addBtn').onclick=()=>{
  if(agents.length>=leisure.length){toast('The office is full. Delete an agent first.');return;}
  const names=['Nova','Pixel','Bolt','Echo','Mochi','Byte','Juno','Orbit','Pip','Ziggy'];
  const name=names.find(n=>!agents.some(a=>a.name===n))||('Agent '+(agents.length+1));
  const a=newAgent({name,role:'Generalist',color:PALETTE.find(c=>!agents.some(x=>x.color===c))||pick(PALETTE)});
  a.root.position.set(1,0,5.5);a.root.rotation.y=Math.PI;agents.push(a);addLog(a,'Joined the office','ok');
  const s=pickLeisure(a); if(s){setPath(a,s,false);} else {a.mode='at';a.spot={type:'idle',pose:'watch',pos:[1,5.5],face:Math.PI,seatY:0};a.status='walking';}
  save();curTab='profile';document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab==='profile'));select(a.id,true);tabBody.dataset.redraw='1';renderTab();toast(name+' joined. Edit their profile.');
};
let toastT=null;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* ------------------------------------------------------------------ autopilot */
let autoT=4;
function autopilot(dt){
  if(!$('#auto').checked)return; autoT-=dt; if(autoT>0)return; autoT=rand(9,16);
  const working=agents.filter(a=>a.task).length; const workers=agents.filter(a=>a.kind!=='relax').length;
  const idle=agents.filter(a=>!a.task&&a.desk!=null&&a.mode==='at');
  if(idle.length&&working<Math.ceil(workers*.55)){const a=pick(idle);callAgent(a,null,'scheduler');}
}
// kick off: a few at desks already
setTimeout(()=>{agents.filter(a=>a.kind!=='relax').filter((a,i)=>[1,3,5].includes(i)).forEach(a=>callAgent(a,null,'scheduler'));},700);

/* ------------------------------------------------------------------ public API for real agents */
const findA=k=>agents.find(x=>x.id===k||x.name.toLowerCase()===String(k).toLowerCase());
function createAgent(cfg){
  cfg=cfg||{}; if(agents.length>=leisure.length) return null;
  const a=newAgent({name:String(cfg.name||'Agent '+(agents.length+1)).slice(0,18),role:cfg.role||'Generalist',color:cfg.color||PALETTE.find(c=>!agents.some(x=>x.color===c))||pick(PALETTE),
    model:cfg.model||'claude-sonnet-5-5',instructions:cfg.instructions||'',kind:cfg.kind==='relax'?'relax':'worker',favorite:cfg.favorite||'any'});
  a.root.position.set(1,0,15);a.root.rotation.y=Math.PI;agents.push(a);addLog(a,'Created by your system as '+a.role+(a.kind==='relax'?' (relax only)':''),'ok');
  const s=pickLeisure(a); if(s) setPath(a,s,false); drawLabel(a); save(); renderRoster(); return a.id;
}
function updateAgent2(k,f){const a=findA(k);if(!a)return false;['name','role','color','model','instructions','favorite'].forEach(x=>{if(f[x]!=null)a[x]=String(f[x]);});if(f.kind)setKind(a,f.kind==='relax'?'relax':'worker');recolor(a);save();if(a.id===selId){tabBody.dataset.redraw='1';renderDrawer();}return true;}
window.agentOffice={
  list:()=>agents.map(a=>({id:a.id,name:a.name,role:a.role,kind:a.kind,favorite:a.favorite,status:a.status,desk:a.desk==null?null:a.desk+1,task:a.task&&a.task.title})),
  create:createAgent,
  update:updateAgent2,
  assignRole:(k,role)=>updateAgent2(k,{role}),
  remove:k=>{const a=findA(k);if(a)removeAgent(a);return !!a;},
  call:(k,task)=>{const a=findA(k);return a?callAgent(a,task,'api'):false;},
  log:(k,msg)=>{const a=findA(k);if(a)addLog(a,String(msg),'');return !!a;},
  complete:k=>{const a=findA(k);if(a&&a.task){a.task.start=a.task.start||Date.now();a.task.dur=0;}return !!a;}
};
// embedding: parent page can drive it with postMessage({agentOffice:'create', args:[{...}]})
addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||!d.agentOffice)return;const fn=window.agentOffice[d.agentOffice];if(typeof fn!=='function')return;
  let r=null;try{r=fn.apply(null,Array.isArray(d.args)?d.args:[]);}catch(err){r={error:String(err)};}
  if(e.source&&d.requestId!=null){try{e.source.postMessage({agentOfficeReply:d.requestId,result:r},'*');}catch(_){}}});

/* ------------------------------------------------------------------ loop */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);const asp=w/h;const fr=asp<1?FR*1.15/asp*.75:FR*.78;
  camera.left=-fr*asp;camera.right=fr*asp;camera.top=fr;camera.bottom=-fr;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let uiT=0;
document.fonts&&document.fonts.ready.then(()=>agents.forEach(drawLabel));
agents.forEach(drawLabel);renderRoster();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  agents.forEach(a=>updateAgent(a,dt,T));
  updatePool(dt); updatePingPong(T); autopilot(dt);
  if(focusOn){focusT+=dt;const p=focusOn.root.position;controls.target.lerp(new THREE.Vector3(p.x,0,p.z),Math.min(1,dt*4));if(focusT>.9)focusOn=null;}
  controls.update(); renderer.render(scene,camera);
  uiT-=dt; if(uiT<=0){uiT=.5;renderRoster();if(selId){const a=agents.find(x=>x.id===selId);if(a){const st=statusOf(a);$('#dRole').innerHTML=`${esc(a.role)} · <span style="color:${st.css};font-weight:700">${st.label}</span>`;syncCall(a);if(curTab==='tasks')renderTab();}}}
  requestAnimationFrame(loop);
}
loop();
addEventListener('beforeunload',save);
setInterval(save,15000);
})();
